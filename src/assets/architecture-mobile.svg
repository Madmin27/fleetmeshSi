<svg xmlns="http://www.w3.org/2000/svg" width="350" height="480" viewBox="0 0 350 480" role="img" aria-labelledby="title desc"><title id="title">Conceptual autonomous fleet architecture</title><desc id="desc">Orchestration, an interoperability layer, then AMR, AGV, drone and autonomous vehicle system classes. A subject-area model, not a universal interface or FleetMesh product.</desc><g font-family="Arial,Helvetica,sans-serif" text-anchor="middle"><path d="M175 84v33M175 190v32M85 222h180M85 222v31M265 222v31M175 222v138M85 360h180M85 360v20M265 360v20" fill="none" stroke="#728e88" stroke-width="2"/><rect x="5" y="8" width="340" height="76" rx="4" fill="#172b29"/><text x="175" y="36" font-size="20" fill="#fff">Fleet Management</text><text x="175" y="62" font-size="17" fill="#c4dad2">Orchestration</text><rect x="5" y="117" width="340" height="73" rx="4" fill="#dff0e9" stroke="#7bab9c"/><text x="175" y="149" font-size="20" fill="#164e42">Interoperability Layer</text><text x="175" y="173" font-size="13" fill="#365e53">Interfaces · messages · capabilities</text><g fill="#fff" stroke="#b5c7c1"><rect x="5" y="253" width="155" height="69" rx="4"/><rect x="190" y="253" width="155" height="69" rx="4"/><rect x="5" y="380" width="155" height="69" rx="4"/><rect x="190" y="380" width="155" height="69" rx="4"/></g><g fill="#1d2829" font-size="21"><text x="82" y="282">AMR</text><text x="267" y="282">AGV</text><text x="82" y="420">Drone</text><text x="267" y="409" font-size="17">Autonomous</text><text x="267" y="432" font-size="17">Vehicle</text></g><g fill="#526367" font-size="12"><text x="82" y="306">Mobile robotics</text><text x="267" y="306">Guided transport</text><text x="175" y="474">CONCEPTUAL MODEL / Support varies.</text></g></g></svg>
